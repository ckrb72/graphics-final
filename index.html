<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./initShaders.js"></script>
    <script src="./MV.js"></script>
    <script src="./main.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script id="vertex-shader" type="text">#version 300 es
        layout(location = 0) in vec3 v_pos;
        layout(location = 1) in vec3 v_norm;
        layout(location = 2) in vec2 v_tex;

        uniform mat4 projection;
        uniform mat4 view;
        uniform mat4 model;
        uniform mat4 norm_matrix;
        uniform mat4 light_space_mat;

        out vec3 f_pos;
        out vec3 f_norm;
        out vec2 f_tex;
        out vec4 f_pos_lightspace;

        void main()
        {
            gl_Position = projection * view * model * vec4(v_pos, 1.0);
            f_pos = vec3(model * vec4(v_pos, 1.0));
            f_norm = mat3(norm_matrix) * v_norm;      // Transform normals to world space
            f_tex = v_tex;
            f_pos_lightspace = light_space_mat * model * vec4(v_pos, 1.0);
        }
    </script>

    <script id="fragment-shader" type="text">#version 300 es
        precision mediump float;

        // Doing lighting in world space

        in vec3 f_pos;
        in vec3 f_norm;
        in vec2 f_tex;
        in vec4 f_pos_lightspace;

        uniform sampler2D ambient_map;
        uniform sampler2D normal_map;
        uniform sampler2D shadow_map;

        uniform vec3 light_pos;

        out vec4 final_color;
        void main()
        {
            vec3 ambient_tex = vec3(texture(ambient_map, f_tex));
            vec3 norm = normalize(f_norm);
            vec3 light_dir = normalize(light_pos - f_pos);
            vec3 diffuse = ambient_tex * max(dot(norm, light_dir), 0.0);

            vec3 lightspace_proj = f_pos_lightspace.xyz / f_pos_lightspace.w;
            lightspace_proj = lightspace_proj * 0.5 + 0.5;
            float in_shadow = lightspace_proj.z - 0.005 > texture(shadow_map, lightspace_proj.xy).r ? 1.0 : 0.0;

            //final_color = vec4(closest_depth, closest_depth, closest_depth, 1.0);
            final_color = vec4((ambient_tex * 0.2) + (1.0 - in_shadow) * diffuse, 1.0);
        }
    </script>

    <script id="shadow-vertex" type="text">#version 300 es
        layout(location = 0) in vec3 v_pos;

        uniform mat4 model;
        uniform mat4 lightspace_mat;

        void main()
        {
            gl_Position = lightspace_mat * model * vec4(v_pos, 1.0);
        }
    </script>

    <script id="passthrough-fragment" type="text">#version 300 es
        void main()
        {

        }
    </script>

    <script id="square-vertex" type="text">#version 300 es
        layout(location = 0) in vec2 pos;
        layout(location = 1) in vec2 v_tex;

        out vec2 f_tex;

        void main()
        {
            gl_Position = vec4(pos, 0.0, 1.0);
            f_tex = v_tex;
        }

    </script>

    <script id="none-fragment" type="text">#version 300 es
        precision mediump float;
        in vec2 f_tex;
        out vec4 final_color;

        uniform sampler2D frame_tex;

        void main()
        {
            final_color = texture(frame_tex, f_tex);
        }

    </script>

    <script id="grayscale-fragment" type="text">#version 300 es
        precision mediump float;
        in vec2 f_tex;
        out vec4 final_color;

        uniform sampler2D frame_tex;
        void main()
        {
            vec4 tex_color = texture(frame_tex, f_tex);

            // Could just average colors together but found a better grayscale formula at https://www.sciencedirect.com/topics/engineering/grayscale-image#:~:text=In%20digital%20images%2C%20grayscale%20means,which%20gray%20has%20multiple%20levels.
            // Takes into account how our eyes percieve red, green and blue intensities differently
            float intensity = 0.2989 * tex_color.r + 0.5870 * tex_color.g + 0.1140 * tex_color.b;
            final_color = vec4(vec3(intensity), 1.0);
        }
    </script>

    <script id="invert-fragment" type="text">#version 300 es
        precision mediump float;
        in vec2 f_tex;
        out vec4 final_color;

        uniform sampler2D frame_tex;
        void main()
        {
            vec3 inverted_color = vec3(1.0 - texture(frame_tex, f_tex));
            final_color = vec4(inverted_color, 1.0);
        }

    </script>

    <canvas id="webgl-canvas">WebGL2 Not Found!</canvas>

    <div id="text-content">
        <div id="instructions">
            <p>Controls (Must be in locked mode to move):</p>
            Click the Canvas to lock mouse <br>
            Move mouse around in locked mode to move camera<br>
            ESC - leave locked mouse mode<br>
            W / S - forward / backward<br>
            A / D - left / right<br>
            Space / Left Shift - up / down <br>
        </div>
        <div id="settings">
            <div id="post-processing">
                <p>Post-Processing:</p>
                <select id="post-process-dropdown">
                    <option value="none">None</option>
                    <option value="grayscale">Grayscale</option>
                    <option value="invert">Invert Colors</option>
                    <option value="blur">Blur</option>
                    <option value="edge-detection">Edge Detection</option>
                </select>
            </div>
            <div>
                <p>Camera:</p>
                <label for="camera-dropdown">Type:</label>
                <select id="camera-dropdown">
                    <option value="first-person">First Person</option>
                    <option value="orbit">Orbit</option>
                </select>
            </div>

            <div id="light-settings">
                <p>Light:</p>
                <label for="color-picker">Light Color:</label>
                <input id="color-picker" type="color" name="color-picker" value="#ffffff" />
                <p>Light Pos:</p>
            </div>
        </div>
    </div>
</body>
</html>
